<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f2e9" />
  <meta name="description" content="DIQIE6 的小站导航：碳名局、AlgoPick、Mini Metro 复刻。每个成品一个独立仓库。" />
  <title>DIQIE6 · 小站导航</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <p class="eyebrow">DIQIE6.GITHUB.IO</p>
      <h1>自己写的一些小网站</h1>
      <p class="lede">
        每个成品一个独立仓库，点开就能用。想加新的？再开一个仓库，
        然后往 <code>js/sites.js</code> 里加一行。
      </p>
    </div>
  </header>

  <main class="wrap">
    <ul class="cards" id="cards"></ul>
    <p class="empty" id="empty" hidden>
      还没有站点。打开 <code>js/sites.js</code>，按注释加一条就会出现在这里。
    </p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© <span id="year"></span> DIQIE6</span>
      <span class="sep">·</span>
      <a href="https://github.com/DIQIE6">GitHub</a>
      <span class="sep">·</span>
      <span class="hint">改 <code>js/sites.js</code> 即可增删站点</span>
    </div>
  </footer>

  <script src="js/sites.js"></script>
  <script>
    (function () {
      var list = document.getElementById('cards');
      var empty = document.getElementById('empty');
      var sites = Array.isArray(window.SITES) ? window.SITES : [];

      document.getElementById('year').textContent = new Date().getFullYear();

      if (!sites.length) {
        empty.hidden = false;
        return;
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      var frag = document.createDocumentFragment();

      sites.forEach(function (site) {
        var li = el('li', 'card');

        var link = el('a', 'card-link');
        link.href = site.url || '#';
        link.setAttribute('rel', 'noopener');

        var top = el('div', 'card-top');
        top.appendChild(el('span', 'tag', site.tag || '站点'));
        top.appendChild(el('span', 'arrow', '打开 →'));
        link.appendChild(top);

        link.appendChild(el('h2', 'card-title', site.name || '未命名站点'));

        if (site.subtitle) {
          link.appendChild(el('p', 'card-subtitle', site.subtitle));
        }
        if (site.desc) {
          link.appendChild(el('p', 'card-desc', site.desc));
        }

        li.appendChild(link);
        frag.appendChild(li);
      });

      list.appendChild(frag);
    })();
  </script>
</body>
</html>
